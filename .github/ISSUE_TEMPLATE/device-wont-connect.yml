name: "🎧 Device won't connect / drops out"
description: "Report a Windows/Linux pairing, connection, or disconnect problem with real diagnostic data."
title: "[connect] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Connection bugs are easiest to diagnose when the host platform state and helper log are included.
        Please fill in every field — a report without a model and log line usually cannot be acted on.
  - type: dropdown
    id: surface
    attributes:
      label: Which desktop platform/build?
      description: Tell us whether this was the published package or a local build.
      multiple: false
      options:
        - Windows desktop app (SoundControl-Setup installer)
        - Linux desktop app (AppImage/deb package)
        - Built from source (`npm run electron`)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Soundcore model and firmware
      description: e.g. "Liberty 4 NC, firmware 2.1.4". Model names are listed in `src/protocol/devices.ts`.
      placeholder: "Liberty 4 NC"
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: What state were the earbuds in when you tried to connect?
      description: SoundControl reads devices paired with the host computer, including devices already playing audio.
      multiple: false
      options:
        - Paired and already connected to this computer
        - Paired but disconnected
        - In pairing mode
        - Already connected to my phone
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, step by step
      description: "Example: Open Devices → Scan devices → list is empty, even though the host Bluetooth settings show the buds."
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics — hex console and helper log
      description: >-
        Paste the **Diagnostics** tab contents from the app, state whether the
        connect screen shows "Bluetooth helper: running" or "not responding",
        and attach the tail of the platform log (`%AppData%\soundcontrol\main.log`
        on Windows or `~/.config/soundcontrol/main.log` on Linux), which records
        whether the helper started (`bridge started via …`).
      render: shell
      placeholder: |
        TX 08 EE 01 01 00 00 02 ..
        RX 09 FF 01 01 ..
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched open and closed issues for my model
          required: true
        - label: I tried the demo mode and the UI itself works (so this is a connectivity issue, not a rendering one)
          required: true
        - label: This report contains no serial numbers, MAC addresses of devices I do not own, or private pairing data
          required: true
