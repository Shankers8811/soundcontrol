name: Release Linux

# Linux desktop artifacts are published alongside the signed Windows asset.
# The package contains Electron and a relocated Python bridge runtime; the
# user's only runtime Bluetooth dependency is the host BlueZ stack.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.0.7'
        required: true
        type: string
      source_ref:
        description: 'Git ref to build (leave blank to use the selected ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test renderer and packaging guard
        run: npm run test:ui && npm run test:package
      # prebuild:linux stages python-embed/ before build:linux. This hard
      # check prevents an otherwise successful-looking Linux release from
      # shipping without the helper that performs host Bluetooth discovery.
      - name: Build AppImage and Debian packages with bundled Python
        run: npm run build:linux -- --publish never
      - name: Verify the relocated runtime is inside the Linux app
        shell: bash
        run: |
          set -euo pipefail
          test -x release/linux-unpacked/resources/python/python3
          release/linux-unpacked/resources/python/python3 -c \
            'import sys, socket; assert sys.prefix.endswith("/resources/python"); assert hasattr(socket, "AF_BLUETOOTH") and hasattr(socket, "BTPROTO_RFCOMM")'
          test "$(find release -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find release -maxdepth 1 -type f -name '*.deb' | wc -l)" -ge 1
          echo "Linux packages contain the bundled Python runtime and both targets were produced."
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Linux assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "SoundControl $RELEASE_TAG" \
            --generate-notes \
            --latest \
            || gh release edit "$RELEASE_TAG" --latest
          gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb --clobber
          gh release view "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: SoundControl-Linux-Release
          path: release/
          if-no-files-found: error
