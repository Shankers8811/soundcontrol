name: Android dump

# Validation + extraction round. The agent's sandbox cannot reach Google or read
# Actions logs, so this workflow runs on a runner with full internet access and
# commits findings into the repo for the agent to read over git.
#
# Findings so far: com.oceanwing.soundcore 6.4.0-17 is a Flutter app; the logic
# is AOT Dart in lib/*/libapp.so. This round tries to verify the field layout
# this project reverse-engineered from captures against the official binary, and
# harvest the device/feature tables.
on:
  push:
    paths:
      - 'ci-triggers/android-dump-probe'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0aa7c-soundcontrol

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          exec > >(tee -a /tmp/diag.txt) 2>&1
          set +e
          pip install --quiet gdown 2>&1 | tail -2
          python -c "import gdown; print('gdown', gdown.__version__)"
          echo "tools ready"

      - name: Download and unpack
        run: |
          exec >> /tmp/diag.txt 2>&1
          set +e
          FOLDER='https://drive.google.com/drive/folders/1wdOXUZhINDk2UH-o8LA6-RisQRHjjv7L'
          echo "### download"
          mkdir -p /tmp/raw && cd /tmp/raw
          gdown --folder "$FOLDER" 2>&1 | grep -vE '^\r? *[0-9]+%|Downloading|From ' | tail -12
          mkdir -p /tmp/x && cd /tmp/x
          for z in $(find /tmp/raw -type f -name '*.zip' | sort); do
            d=/tmp/x/$(basename "$z" .zip | tr -d '+ ')
            mkdir -p "$d"; unzip -q -o "$z" -d "$d" 2>&1 | tail -2
          done
          for rz in $(find /tmp/x -type f -name '*.zip' | grep '/assets/'); do
            mkdir -p "${rz%.zip}_unpacked"; unzip -q -o "$rz" -d "${rz%.zip}_unpacked" 2>&1 | tail -1
          done
          echo "unpacked. total files: $(find /tmp/x -type f | wc -l)"

      - name: Validate the documented protocol against the official binary
        run: |
          exec >> /tmp/diag.txt 2>&1
          set +e
          echo
          echo "### protocol validation against libapp.so"
          LIBAPP=$(find /tmp/x -name 'libapp.so' -path '*arm64*' | head -1)
          echo "target: $LIBAPP ($(stat -c%s "$LIBAPP") bytes)"

          # Frame templates this project reverse-engineered from captures. If the
          # official app embeds them as constants, scanning raw bytes proves the
          # layouts. Payload/opcode portion only, so a leading length byte cannot
          # hide a match.
          declare -A PATS=(
            [init_01_01]='00000001010a00'
            [battery_01_03]='00000001030a00'
            [anc_06_81]='00000006810e00'
            [eq_02_81]='00000002811400'
            [bassup_02_82]='00000002820b00'
            [spatial_02_86]='00000002860a00'
            [gaming_01_87]='00000001870c00'
            [find_01_88]='00000001880c00'
            [reset_01_85]='00000001850a00'
            [ldac_query]='000000017f0a00'
            [ldac_set]='00000001ff0b00'
            [dual_0b_84]='0000000b840b00'
          )
          for name in "${!PATS[@]}"; do
            hex=${PATS[$name]}
            raw=$(printf '%s' "$hex" | sed 's/../\\x&/g')
            n=$(grep -aoP "$raw" "$LIBAPP" 2>/dev/null | wc -l)
            printf '  %-14s %-16s raw-byte hits: %s\n' "$name" "$hex" "$n"
          done

          echo
          echo "--- also scan every native lib, not just libapp"
          for so in $(find /tmp/x -name '*.so' | sort); do
            hits=$(grep -aoP '\x00\x00\x00\x06\x81\x0e\x00' "$so" 2>/dev/null | wc -l)
            [ "$hits" -gt 0 ] && echo "ANC pattern in $so: $hits"
          done
          echo "(scan complete)"

          echo
          echo "### UUID / transport markers in libapp strings"
          strings -n 5 "$LIBAPP" > /tmp/s.txt
          grep -iE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/s.txt | sort -u | head -30
          echo "--- known project UUID 0cf12d31-fac3-4553-bd80-d6832e7b3947:"
          grep -c '0cf12d31' /tmp/s.txt
          echo "--- short/16-bit UUID forms:"
          grep -oiE '0000[0-9a-f]{4}-0000-1000-8000-00805f9b34fb' /tmp/s.txt | sort -u | head -20
          echo "--- BLE / rfcomm / spp vocabulary:"
          grep -icE 'rfcomm|bluetoothsocket|createRfcomm|spp' /tmp/s.txt
          grep -iE 'rfcomm|spp|serial ?port' /tmp/s.txt | sort -u | head -15

      - name: Harvest device and feature tables
        run: |
          exec >> /tmp/diag.txt 2>&1
          set +e
          echo
          echo "### device + feature harvest"
          mkdir -p analysis/android
          OUT=analysis/android

          echo "--- every JSON in the app (device/feature tables often live here)"
          find /tmp/x -type f -name '*.json' -size -2M -printf '%10s  %p\n' | sort -k2 > "$OUT/json-files.txt"
          wc -l < "$OUT/json-files.txt"

          echo
          echo "--- SKU -> asset cross reference"
          : > "$OUT/sku-reference.txt"
          find /tmp/x -type f \( -name '*.json' -o -name '*.xml' -o -name '*.properties' -o -name '*.bin' \) -size -2M 2>/dev/null | while read -r f; do
            for sku in $(grep -aoiE '\ba[0-9]{4}\b' "$f" 2>/dev/null | tr 'A-Z' 'a-z' | sort -u); do
              echo "$sku  $f" >> "$OUT/sku-reference.txt"
            done
          done
          echo "sku-reference lines: $(wc -l < "$OUT/sku-reference.txt")"
          cut -d' ' -f1 "$OUT/sku-reference.txt" 2>/dev/null | sort | uniq -c | sort -rn | head -40

          echo
          echo "--- SKUs from filenames (full inventory)"
          find /tmp/x -type f | grep -oiE 'a[0-9]{4}' | tr 'A-Z' 'a-z' | sort -u > "$OUT/skus-from-filenames.txt"
          echo "distinct SKUs: $(wc -l < "$OUT/skus-from-filenames.txt")"
          tr '\n' ' ' < "$OUT/skus-from-filenames.txt"

          echo
          echo "--- feature vocabulary (protocol keys) from libapp"
          grep -iE 'anc|ambient|transparen|noise|equaliz|bass ?up|spatial|ldac|wear|in.?ear|find ?my|dual|multipoint|auto.?power|touch|gesture|firmware|battery|charg|hear ?id|gaming|latency|safe.?volume|wind|vocal|anko|melody|hearid' \
            /tmp/s.txt | sort -u | head -2000 > "$OUT/feature-vocabulary.txt"
          echo "lines: $(wc -l < "$OUT/feature-vocabulary.txt")"

          echo
          echo "--- candidate command verbs in libapp strings"
          grep -iE '^(get|set|read|write|query|enable|disable|toggle)[A-Z][A-Za-z]{2,40}$' /tmp/s.txt | sort -u | head -200 > "$OUT/command-verbs.txt"
          wc -l < "$OUT/command-verbs.txt"
          head -60 "$OUT/command-verbs.txt"

          echo
          echo "### small config assets worth reading"
          for f in $(find /tmp/x -type f \( -name 'OTA.xml' -o -name '*.properties' \) -size -100k 2>/dev/null | head -12); do
            echo "=== $f"
            head -40 "$f"
          done > "$OUT/small-config-assets.txt"
          wc -l < "$OUT/small-config-assets.txt"

          echo
          echo "### any file mentioning protocol-ish hex frames as text"
          grep -rliE '08 ?ee|0x08, ?0xee' /tmp/x --include='*.json' --include='*.xml' --include='*.txt' 2>/dev/null | head -10

          find "$OUT" -type f -size +3M -delete
          echo "payload: $(du -sh "$OUT" | cut -f1) files: $(find "$OUT" -type f | wc -l)"

      - name: Write report
        if: always()
        run: |
          mkdir -p analysis
          {
            echo "# Android dump extraction"
            echo
            echo "Run: ${{ github.run_id }}"
            echo
            echo '```'
            cat /tmp/diag.txt 2>/dev/null || echo "(no diagnostics)"
            echo '```'
          } > analysis/android-extraction.md
          echo "payload: $(du -sh analysis | cut -f1)"

      - name: Commit findings
        if: always()
        run: |
          git config user.name  "soundcontrol-ci"
          git config user.email "ci@users.noreply.github.com"
          git add analysis
          git commit -m "data: validate protocol against official binary, harvest device tables" || echo "nothing to commit"
          git push origin HEAD:arena/01a0aa7c-soundcontrol
