name: Android dump probe

# Diagnostic relay. The agent's sandbox cannot reach Google at all (TLS to
# *.google.com is blocked) and cannot read Actions logs (results-receiver is
# blocked too), so this workflow runs on a runner with full internet access and
# commits every diagnostic into analysis/android-probe.md, which the agent can
# read over git.
on:
  push:
    paths:
      - 'ci-triggers/android-dump-probe'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0aa7c-soundcontrol

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gdown
        run: pip install gdown

      - name: Download the Drive folder with full diagnostics
        run: |
          FOLDER='https://drive.google.com/drive/folders/1wdOXUZhINDk2UH-o8LA6-RisQRHjjv7L'
          exec > >(tee /tmp/diag.txt) 2>&1

          echo "### runner network check"
          for h in drive.google.com drive.usercontent.google.com; do
            printf '%s -> ' "$h"
            curl -sS -o /dev/null -w '%{http_code}\n' --max-time 20 "https://$h/" || echo FAIL
          done
          echo
          echo "### gdown version"
          gdown --version || true
          echo
          echo "### folder page: extract file ids"
          curl -sS --max-time 60 -L "$FOLDER" -o /tmp/folder.html
          echo "folder html bytes: $(stat -c%s /tmp/folder.html 2>/dev/null || echo 0)"
          grep -oE '\["[A-Za-z0-9_-]{25,}"' /tmp/folder.html | tr -d '["' | sort -u > /tmp/ids.txt || true
          echo "ids found: $(wc -l < /tmp/ids.txt)"
          head -20 /tmp/ids.txt
          echo
          echo "### attempt 1: gdown --folder"
          mkdir -p /tmp/dump && cd /tmp/dump
          set +e
          gdown --folder "$FOLDER" --remaining-ok > /tmp/gdown1.log 2>&1
          echo "gdown --folder exit: $?"
          tail -30 /tmp/gdown1.log
          echo "files after attempt 1:"
          find /tmp/dump -type f -printf '%10s  %p\n' | head -20
          echo
          echo "### attempt 2: per-file id"
          mkdir -p /tmp/dump2 && cd /tmp/dump2
          while read -r id; do
            [ -z "$id" ] && continue
            echo "--- id $id"
            gdown "$id" > /tmp/gdown2.log 2>&1
            echo "exit: $?"
            tail -6 /tmp/gdown2.log
          done < /tmp/ids.txt
          echo "files after attempt 2:"
          find /tmp/dump2 -type f -printf '%10s  %p\n' | head -20
          echo
          echo "### attempt 3: raw usercontent endpoint"
          mkdir -p /tmp/dump3 && cd /tmp/dump3
          while read -r id; do
            [ -z "$id" ] && continue
            curl -sS -L --max-time 120 -o "$id.bin" \
              -w "id=$id http=%{http_code} size=%{size_download}\n" \
              "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" || echo "curl failed $id"
          done < /tmp/ids.txt
          echo "files after attempt 3:"
          find /tmp/dump3 -type f -printf '%10s  %p\n' | head -20
          echo
          echo "### final combined listing"
          find /tmp/dump /tmp/dump2 /tmp/dump3 -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2

      - name: Inspect whatever downloaded
        if: always()
        run: |
          exec >> /tmp/diag.txt 2>&1
          echo
          echo "### archive inspection"
          for f in $(find /tmp/dump /tmp/dump2 /tmp/dump3 -type f 2>/dev/null | sort); do
            echo "=== $f ($(stat -c%s "$f") bytes)"
            file "$f" 2>/dev/null || true
            if unzip -l "$f" >/dev/null 2>&1; then
              echo "  zip: OK"
              unzip -l "$f" | head -8
            else
              echo "  zip: not a standalone archive"
              head -c 200 "$f" | xxd | head -5
            fi
          done

      - name: Write report into the branch
        if: always()
        run: |
          mkdir -p analysis
          {
            echo "# Android dump probe (v2)"
            echo
            echo "Run: ${{ github.run_id }}"
            echo
            echo '```'
            cat /tmp/diag.txt 2>/dev/null || echo "(no diagnostics captured)"
            echo '```'
          } > analysis/android-probe.md
          wc -c analysis/android-probe.md
          git config user.name  "soundcontrol-ci"
          git config user.email "ci@users.noreply.github.com"
          git add analysis/android-probe.md
          git commit -m "probe: Drive download diagnostics" || echo "nothing to commit"
          git push origin HEAD:arena/01a0aa7c-soundcontrol
