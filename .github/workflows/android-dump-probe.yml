name: Android dump

# The agent's sandbox cannot reach Google (TLS to *.google.com is blocked) and
# cannot read Actions logs (results-receiver.actions.githubusercontent.com is
# blocked), so this workflow runs on a runner with full internet access and
# commits findings plus diagnostics into the repo, where the agent reads them
# over git.
#
# Finding from run 3: the official soundcore app is a *Flutter* app. classes.dex
# is only ~330 KB (the Flutter embedding, package com.oceanwing.soundcore); the
# real logic is AOT-compiled Dart in lib/*/libapp.so, so jadx/dex analysis is
# the wrong tool. This iteration inspects the Dart binaries, the resource
# bundle and the asset inventory instead.
on:
  push:
    paths:
      - 'ci-triggers/android-dump-probe'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0aa7c-soundcontrol

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          exec > >(tee -a /tmp/diag.txt) 2>&1
          set +e
          pip install --quiet gdown 2>&1 | tail -2
          python -c "import gdown; print('gdown', gdown.__version__)"
          # binwalk/xxd/binutils give us strings + structure inspection
          command -v strings xxd file unzip python3
          echo "tools ready"

      - name: Download the Drive folder
        run: |
          exec >> /tmp/diag.txt 2>&1
          set +e
          FOLDER='https://drive.google.com/drive/folders/1wdOXUZhINDk2UH-o8LA6-RisQRHjjv7L'
          echo
          echo "### download"
          mkdir -p /tmp/raw && cd /tmp/raw
          gdown --folder "$FOLDER" 2>&1 | grep -vE '^\r? *[0-9]+%|Downloading\.\.\.|From \(|From:' | tail -20
          echo "gdown exit: ${PIPESTATUS[0]}"
          find /tmp/raw -type f -printf '%10s  %p\n' | sort -k2
          echo "total: $(du -sh /tmp/raw | cut -f1)"

      - name: Unpack everything
        run: |
          exec >> /tmp/diag.txt 2>&1
          set +e
          echo
          echo "### unpack"
          mkdir -p /tmp/x && cd /tmp/x
          for z in $(find /tmp/raw -type f -name '*.zip' | sort); do
            d=/tmp/x/$(basename "$z" .zip | tr -d '+ ')
            mkdir -p "$d"; unzip -q -o "$z" -d "$d" 2>&1 | tail -2
          done
          echo "### full tree by extension"
          find /tmp/x -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -25
          echo
          echo "### native libraries"
          find /tmp/x -type f \( -name '*.so' -o -name 'libapp*' \) -printf '%12s  %p\n' | sort -k2
          echo
          echo "### manifest / identity"
          MAN=$(find /tmp/x -name 'AndroidManifest.xml' | head -1)
          echo "manifest: $MAN"
          if [ -n "$MAN" ]; then strings "$MAN" | grep -iE 'package=|versionName|soundcore|oceanwing|minSdk|targetSdk' | head -12; fi
          echo
          echo "### nested zips inside assets"
          find /tmp/x -type f -name '*.zip' -printf '%12s  %p\n' | sort -k2 | head -20
          echo
          echo "### unpack resource.zip and friends"
          for rz in $(find /tmp/x -type f -name '*.zip' | grep -v '/tmp/raw' | sort); do
            case "$rz" in
              */assets/*|*/flutter_assets/*)
                d="${rz%.zip}_unpacked"; mkdir -p "$d"
                unzip -q -o "$rz" -d "$d" 2>&1 | tail -2
                echo "$(basename "$rz") -> $d : $(find "$d" -type f | wc -l) files" ;;
            esac
          done

      - name: Analyse the Dart binary and resources
        run: |
          exec >> /tmp/diag.txt 2>&1
          set +e
          echo
          echo "### Dart AOT analysis"
          mkdir -p analysis/android
          OUT=analysis/android

          : > /tmp/libapp_strings.txt
          for so in $(find /tmp/x -type f -name 'libapp*.so' | sort); do
            echo "-- $so ($(stat -c%s "$so") bytes)"
            strings -n 5 "$so" >> /tmp/libapp_strings.txt
          done
          sort -u /tmp/libapp_strings.txt -o /tmp/libapp_strings.txt
          echo "libapp strings: $(wc -l < /tmp/libapp_strings.txt)"

          echo
          echo "--- protocol keyword hits in libapp"
          grep -icE 'soundcore' /tmp/libapp_strings.txt
          grep -iE '(anc|ambient|transparen|noise|cancel)' /tmp/libapp_strings.txt | head -20
          echo
          echo "--- frame-magic / opcode looking literals"
          grep -iE '^[0-9a-f]{8,}$' /tmp/libapp_strings.txt | head -20
          grep -E '08[ _]?[eE][eE]|09[ _]?[fF][fF]' /tmp/libapp_strings.txt | head -20
          echo
          echo "--- device / SKU references"
          grep -oiE '\bA[0-9]{4}\b' /tmp/libapp_strings.txt | sort -u > "$OUT/skus-in-libapp.txt"
          wc -l < "$OUT/skus-in-libapp.txt"
          head -40 "$OUT/skus-in-libapp.txt"

          # Curated, capped string dump: protocol/feature vocabulary only.
          grep -iE 'anc|ambient|transparen|equaliz|equaliser|bassup|bass ?up|spatial|ldac|wear ?detect|in.?ear|find ?my|dual ?conn|multipoint|auto.?power|touch|gesture|firmware|battery|charg|hearid|hear ?id|gaming|latency|safe ?volume|wind ?noise|vocal' \
            /tmp/libapp_strings.txt | sort -u | head -1500 > "$OUT/libapp-protocol-vocabulary.txt"
          echo "vocabulary lines: $(wc -l < "$OUT/libapp-protocol-vocabulary.txt")"

          echo
          echo "### asset inventory / device tables"
          find /tmp/x -type f -path '*/assets/*' ! -name '*.png' ! -name '*.webp' ! -name '*.ttf' ! -name '*.otf' \
            -printf '%12s  %p\n' 2>/dev/null | sort -k2 > "$OUT/asset-inventory.txt"
          echo "inventory lines: $(wc -l < "$OUT/asset-inventory.txt")"
          head -30 "$OUT/asset-inventory.txt"

          echo
          echo "--- SKUs seen in asset filenames (lottie + resource tables)"
          grep -oiE 'a[0-9]{4}' "$OUT/asset-inventory.txt" | tr 'A-Z' 'a-z' | sort -u | tr '\n' ' '
          echo

          echo
          echo "### resource zip contents"
          if [ -d /tmp/x ]; then
            for d in $(find /tmp/x -type d -name '*resource_unpacked*' -o -type d -name '*resource.zip_unpacked*'); do
              echo "-- $d ($(find "$d" -type f | wc -l) files)"
              find "$d" -type f -printf '%12s  %p\n' | sort -k2 | head -40
            done > "$OUT/resource-zip-listing.txt"
          fi
          head -40 "$OUT/resource-zip-listing.txt" 2>/dev/null

          echo
          echo "### searching all bytes for the 08 EE frame magic"
          grep -rlaP '\x08\xee' /tmp/x 2>/dev/null | head -20 || echo "(no binary match)"

          find "$OUT" -type f -size +3M -delete
          echo "payload: $(du -sh "$OUT" | cut -f1) files: $(find "$OUT" -type f | wc -l)"

      - name: Write report
        if: always()
        run: |
          mkdir -p analysis
          {
            echo "# Android dump extraction"
            echo
            echo "Run: ${{ github.run_id }}"
            echo
            echo '```'
            cat /tmp/diag.txt 2>/dev/null || echo "(no diagnostics)"
            echo '```'
          } > analysis/android-extraction.md
          echo "report bytes: $(stat -c%s analysis/android-extraction.md)"
          echo "payload: $(du -sh analysis | cut -f1)"

      - name: Commit findings
        if: always()
        run: |
          git config user.name  "soundcontrol-ci"
          git config user.email "ci@users.noreply.github.com"
          git add analysis
          git commit -m "data: inspect the Flutter soundcore app dump (Dart AOT + assets)" || echo "nothing to commit"
          git push origin HEAD:arena/01a0aa7c-soundcontrol
