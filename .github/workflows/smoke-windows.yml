name: Windows Desktop Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: read

jobs:
  launch-win:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Windows application
        env:
          SOUNDCONTROL_PYTHON_REQUIRED: '1'
        run: npm run build:win -- --publish never
      - name: Verify the installer upgrades an existing app
        shell: pwsh
        run: ./scripts/smoke-windows-upgrade.ps1
      # Seeds a legacy Run-key entry exactly as an older install would have
      # written it, then runs the app's own enforcement code (autostart.cjs)
      # against the packaged exe through Electron's login-item API and asserts
      # the registration is gone afterwards.
      - name: Verify Windows autostart is enforced off (legacy entry cleanup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release\win-unpacked\SoundControl.exe'
          if (-not (Test-Path $exe)) { throw "Packaged executable was not found at $exe" }
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          Set-ItemProperty -Path $runKey -Name 'SoundControl' -Value ('"' + $exe + '"')
          $env:SOUNDCONTROL_VERIFY_EXE = $exe
          npx electron scripts/verify-autostart.cjs
          if ($LASTEXITCODE -ne 0) { throw "verify-autostart.cjs exited with $LASTEXITCODE" }
          $left = Get-ItemProperty -Path $runKey -Name 'SoundControl' -ErrorAction SilentlyContinue
          if ($left) { throw "legacy Run-key entry survived enforcement: $($left.'SoundControl')" }
          Write-Host 'AUTOSTART_CLEAN legacy Windows startup registration removed by the new version'
      # The release acceptance test for "closing the window really closes the
      # application": graceful WM_CLOSE, then no SoundControl.exe, no Python
      # helper, no listener on 8765, no delayed restart.
      - name: Lifecycle - window close exits app and helper completely
        shell: pwsh
        run: ./scripts/smoke-windows-lifecycle.ps1
      - name: Launch the packaged desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release\win-unpacked\SoundControl.exe'
          if (-not (Test-Path $exe)) {
            throw "Packaged executable was not found at $exe"
          }
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($app.HasExited) {
              $log = Join-Path $env:APPDATA 'soundcontrol\main.log'
              if (Test-Path $log) { Get-Content $log }
              throw "SoundControl exited during the smoke-test launch (exit code $($app.ExitCode))"
            }
            $log = Join-Path $env:APPDATA 'soundcontrol\main.log'
            if (-not (Test-Path $log)) {
              throw "SoundControl stayed alive but did not create its startup log"
            }
            Get-Content $log
            if (-not (Select-String -Path $log -Pattern 'window ready-to-show')) {
              throw "SoundControl did not report that its Electron window became ready"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
