name: Windows Desktop Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: read

jobs:
  launch-win:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phase 18 Task 16 — Windows audio regression proof. Snapshot the
      # machine's audio configuration BEFORE any SoundControl process runs;
      # the final step compares against it. Exit 2 = no audio endpoints on
      # this runner (recorded honestly, not a failure); a later DIFFERENCE is
      # the regression that fails the job.
      - name: Capture Windows audio state (before SoundControl runs)
        shell: pwsh
        run: |
          # Child process + explicit exits on every path: nested pwsh exit
          # codes must never leak into this step's own outcome.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/capture-windows-audio-state.ps1 -OutFile audio-before.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::Audio-state harness failed (exit $code) - fix scripts/capture-windows-audio-state.ps1; the regression proof cannot run."
            exit $code
          }
          if (Test-Path audio-before.txt) {
            Get-Content audio-before.txt
          } else {
            Write-Host '::warning::Audio endpoints unavailable on this runner (AUDIO_STATE_CAPTURE=UNAVAILABLE) - the audio regression comparison will be skipped, recorded honestly as NOT PERFORMED.'
          }
          exit 0
      - name: Build the Windows application
        env:
          SOUNDCONTROL_PYTHON_REQUIRED: '1'
        run: npm run build:win -- --publish never
      - name: Verify the installer upgrades an existing app
        shell: pwsh
        run: ./scripts/smoke-windows-upgrade.ps1
      # The artifact a user actually receives: clean install (not an upgrade),
      # launch the INSTALLED copy twice with a graceful close each time, then
      # silent uninstall - asserting no directory, registry entry, process,
      # helper, port 8765 listener or startup registration survives.
      - name: Clean install, two launches, uninstall leaves nothing behind
        shell: pwsh
        run: ./scripts/smoke-windows-install.ps1
      # Seeds a legacy Run-key entry exactly as an older install would have
      # written it, then runs the app's own enforcement code (autostart.cjs)
      # against the packaged exe through Electron's login-item API and asserts
      # the registration is gone afterwards.
      - name: Verify Windows autostart is enforced off (legacy entry cleanup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release\win-unpacked\SoundControl.exe'
          if (-not (Test-Path $exe)) { throw "Packaged executable was not found at $exe" }
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          # A pristine Windows profile may not have the Run key at all yet.
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null }
          # Older SoundControl builds registered through Electron's login-item
          # API, which stores the Run value under the AppUserModelID with the
          # quoted executable as data — reproduce that entry byte-for-byte.
          $legacyName = 'com.soundcontrol.desktop'
          Set-ItemProperty -Path $runKey -Name $legacyName -Value ('"' + $exe + '"')
          $env:SOUNDCONTROL_VERIFY_EXE = $exe
          npx electron scripts/verify-autostart.cjs
          if ($LASTEXITCODE -ne 0) { throw "verify-autostart.cjs exited with $LASTEXITCODE" }
          $left = Get-ItemProperty -Path $runKey -Name $legacyName -ErrorAction SilentlyContinue
          if ($left) { throw "legacy Run-key entry survived enforcement: $($left.$legacyName)" }
          Write-Host 'AUTOSTART_CLEAN legacy Windows startup registration removed by the new version'
      # The release acceptance test for "closing the window really closes the
      # application": graceful WM_CLOSE, then no SoundControl.exe, no Python
      # helper, no listener on 8765, no delayed restart.
      - name: Lifecycle - window close exits app and helper completely
        shell: pwsh
        run: ./scripts/smoke-windows-lifecycle.ps1
      - name: Launch the packaged desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release\win-unpacked\SoundControl.exe'
          if (-not (Test-Path $exe)) {
            throw "Packaged executable was not found at $exe"
          }
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($app.HasExited) {
              $log = Join-Path $env:APPDATA 'soundcontrol\main.log'
              if (Test-Path $log) { Get-Content $log }
              throw "SoundControl exited during the smoke-test launch (exit code $($app.ExitCode))"
            }
            $log = Join-Path $env:APPDATA 'soundcontrol\main.log'
            if (-not (Test-Path $log)) {
              throw "SoundControl stayed alive but did not create its startup log"
            }
            Get-Content $log
            if (-not (Select-String -Path $log -Pattern 'window ready-to-show')) {
              throw "SoundControl did not report that its Electron window became ready"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      # Phase 18 Task 16 — the proof: after building, installing, launching
      # (twice), uninstalling and killing SoundControl, Windows audio must be
      # EXACTLY as it was. Exit 1 (state changed) fails the job; exit 2 means
      # the runner exposed no audio endpoints, so the comparison is honestly
      # recorded as not performed instead of pretended.
      - name: Windows audio regression proof - state must be unchanged
        shell: pwsh
        run: |
          if (-not (Test-Path audio-before.txt)) {
            Write-Host '::warning::No baseline captured (runner had no audio endpoints) - AUDIO REGRESSION COMPARISON NOT PERFORMED on this runner.'
            exit 0
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/capture-windows-audio-state.ps1 -Baseline audio-before.txt
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host 'WINDOWS AUDIO REGRESSION PROOF PASSED - SoundControl left Windows audio untouched.'
            exit 0
          }
          if ($code -eq 1) {
            throw 'REGRESSION: Windows audio state changed while SoundControl ran - see the diff above.'
          }
          if ($code -eq 3) {
            Write-Host '::warning::Audio endpoints unavailable during comparison (AUDIO_STATE_COMPARE=UNAVAILABLE) - comparison NOT PERFORMED, not faked.'
            exit 0
          }
          Write-Host "::error::Audio-state harness failed during comparison (exit $code) - fix the harness; the proof cannot run."
          exit $code
