name: Release Windows

# Tagging a commit on main (e.g. `git tag v1.0.5 main && git push origin v1.0.5`)
# builds the standard NSIS Windows installer and publishes one asset on
# a new GitHub Release. A commit on any arena session branch whose message
# contains [publish-windows] can also rebuild the stable release matching
# package.json without requiring an artifact download.
# SoundControl-Setup.exe. The in-app download button deep-links to this name
# via "/releases/latest/download/..." so every client gets the newest build.
#
# Authenticode code signing is REQUIRED for every release this workflow
# publishes. The build signs through electron-builder's env-based mechanism
# (WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD — see docs/WINDOWS-CODE-SIGNING.md)
# and is gated three ways, so an unsigned installer can never be released:
#   1. "Require Authenticode signing credentials" fails the job before the
#      build if the certificate secrets are missing;
#   2. `--config.win.forceCodeSigning=true` makes electron-builder itself
#      hard-fail if any signable executable would ship unsigned;
#   3. "Verify Authenticode signatures (release gate)" checks the real
#      generated EXEs with Get-AuthenticodeSignature + `signtool verify /pa`
#      (valid signature, trusted chain, currently-valid certificate,
#      publisher identity, SHA-256 recorded, every shipped executable signed)
#      — the GitHub Release is only published after that gate passes.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   WIN_CSC_LINK          base64 of the .pfx/.p12 certificate
#                         (legacy alias still honored: WINDOWS_CERTIFICATE_BASE64)
#   WIN_CSC_KEY_PASSWORD  the certificate's password
#                         (legacy alias still honored: WINDOWS_CERTIFICATE_PASSWORD)
# Optional repository variable:
#   WINDOWS_EXPECTED_PUBLISHER  signer identity the gate must see (e.g. the
#                               publisher's name in the certificate subject)
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'arena/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.0.2'
        required: true
        type: string
      source_ref:
        description: 'Git ref to build (leave blank to use the selected ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-win:
    # Tag pushes are the documented release path (see the header comment), and
    # a tag push payload has no head_commit, so the marker check can never
    # satisfy it: without the refs/tags clause every `git push origin vX.Y.Z`
    # silently skipped this job. Branch pushes keep requiring the marker so
    # ordinary work on an arena branch never publishes.
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[publish-windows]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Test before packaging: the Windows-safe unit suites (renderer state,
      # render smoke, packaging-guard self-test). The full cross-platform
      # suite (bridge/E2E/lifecycle) runs in tests.yml on ubuntu — the
      # lifecycle harness deliberately uses a shebang-based helper that only
      # works on Unix. `npm run build:win` below additionally runs the
      # 479-check protocol suite + tsc + vite build + packaging whitelist.
      - name: Test (UI state/render + packaging guard)
        run: npm run test:ui && npm run test:package
      # Release gate 1 — fail fast, before spending a build on it. Production
      # Windows releases must never fall back to an unsigned installer, so a
      # missing certificate secret is a build failure, not a warning. Normal
      # CI builds (build-windows.yml) remain allowed to be unsigned because
      # their artifacts are not distributed.
      - name: Require Authenticode signing credentials
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "::error::Production Windows releases must be Authenticode-signed, but no signing credentials are configured."
            echo "::error::Add the repository secrets WIN_CSC_LINK (base64 of the .pfx/.p12) and WIN_CSC_KEY_PASSWORD (certificate password)."
            echo "::error::See docs/WINDOWS-CODE-SIGNING.md for certificate options and the exact setup steps."
            exit 1
          fi
          echo "Signing credentials are configured — the release build will be signed and verified."
      # Decode the certificate from the secret into cert.p12 and hand it to
      # electron-builder through its supported env vars. Nothing is printed:
      # no secret values, no certificate contents. cert.p12 is deleted by the
      # cleanup step below before any artifact is uploaded.
      - name: Stage the Authenticode certificate from secrets
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          material="$WIN_CSC_LINK"
          case "$material" in
            data:*)
              # data: URI, e.g. data:application/x-pkcs12;base64,AAAA...
              material="${material#data:}"
              material="${material#*;base64,}"
              printf '%s' "$material" | tr -d '\r\n' | base64 --decode > cert.p12
              ;;
            *)
              if [ -f "$material" ]; then
                # A path to an existing certificate file.
                cp "$material" cert.p12
              else
                # Plain base64 of the .pfx/.p12 (the documented form).
                printf '%s' "$material" | tr -d '\r\n' | base64 --decode > cert.p12
              fi
              ;;
          esac
          if [ ! -s cert.p12 ]; then
            echo "::error::WIN_CSC_LINK decoded to an empty file — check that the secret contains the base64 of a .pfx/.p12 certificate."
            exit 1
          fi
          # Sanity check without printing contents: a PKCS#12 file is a DER
          # SEQUENCE, so its first byte is 0x30.
          first_byte="$(head -c 1 cert.p12 | od -An -tx1 | tr -d ' \n')"
          if [ "$first_byte" != "30" ]; then
            echo "::error::WIN_CSC_LINK does not look like a .pfx/.p12 certificate (expected DER/PKCS#12). Store the base64 of the certificate file itself."
            exit 1
          fi
          # electron-builder signs the app exe, the bundled Python executables,
          # the NSIS uninstaller and the installer from these two variables.
          echo "WIN_CSC_LINK=$(cygpath -w "$PWD/cert.p12")" >> "$GITHUB_ENV"
          echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Certificate staged ($(wc -c < cert.p12) bytes) — electron-builder will Authenticode-sign the build with SHA-256."
      # Release gate 2 — build the Windows installer with signing forced:
      # `forceCodeSigning` makes electron-builder fail the build itself if any
      # signable executable would end up unsigned (bad password, unreadable
      # certificate, signtool failure), instead of quietly shipping unsigned.
      # SOUNDCONTROL_PYTHON_REQUIRED makes the `prebuild:win` hook hard-fail if
      # the bundled Python runtime could not be staged, so a release can never
      # ship without it (that runtime is what makes earbud detection work with
      # zero user setup).
      - name: Build signed Windows installer (with bundled Python runtime)
        env:
          SOUNDCONTROL_PYTHON_REQUIRED: '1'
        run: npm run build:win -- --publish never --config.win.forceCodeSigning=true
      - name: Verify the bundled Python runtime shipped
        shell: bash
        run: |
          set -euo pipefail
          test -f release/win-unpacked/resources/python/python.exe
          ls -la release/win-unpacked/resources/python | head -15
          echo "Bundled runtime present — desktop users install nothing extra."
      - name: Stage the single installer asset
        shell: bash
        run: |
          set -euo pipefail
          echo "Built Windows distributables:"
          ls -la release/*.exe
          # Exactly one artifact: the NSIS installer (win-unpacked/ is a
          # subdirectory, so maxdepth 1 only sees the distributable itself).
          test "$(find release -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          INSTALLER="$(find release -maxdepth 1 -name '*.exe' | head -n 1)"
          test -n "$INSTALLER"
          mkdir -p release-assets
          cp "$INSTALLER" "release-assets/SoundControl-Setup.exe"
          echo "Staged release asset:"
          ls -la release-assets/
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
      # Release gate 3 — verify the ACTUAL generated EXE (never a certificate
      # file): valid Authenticode signature, trusted chain (signtool verify
      # /pa), publisher identity (matching WINDOWS_EXPECTED_PUBLISHER when
      # that variable is set), unmodified-after-signing, SHA-256 recorded to
      # the step summary and SIGNING-SUMMARY.txt, and every executable in the
      # shipped package signed. The release is published only if this passes.
      - name: Verify Authenticode signatures (release gate)
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_PUBLISHER) {
            ./scripts/verify-windows-signing.ps1 -ReleaseDir release -InstallerPath release-assets/SoundControl-Setup.exe -RequireSigned -ExpectedPublisher $env:EXPECTED_PUBLISHER
          } else {
            Write-Host 'NOTE: WINDOWS_EXPECTED_PUBLISHER is not set — the gate requires a Valid signature with a non-empty publisher identity, but does not pin the exact publisher. Setting that repository variable is recommended once the certificate is known.' -ForegroundColor Yellow
            ./scripts/verify-windows-signing.ps1 -ReleaseDir release -InstallerPath release-assets/SoundControl-Setup.exe -RequireSigned
          }
          if ($LASTEXITCODE -ne 0) { throw "release signing gate failed (exit $LASTEXITCODE)" }
      - name: Verify the installer upgrades an existing app
        shell: pwsh
        run: ./scripts/smoke-windows-upgrade.ps1
      - name: Remove certificate material
        if: always()
        shell: bash
        run: rm -f cert.p12
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: $(grep '^tag=' "$GITHUB_OUTPUT" | cut -d= -f2)"
      # Published only after every signing gate above has passed.
      - name: Publish GitHub Release with the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Publishing release for tag: $RELEASE_TAG"
          # Create the release (no-op on a re-run), then upload the installer
          # from release-assets/, whose filename is the published asset name.
          gh release create "$RELEASE_TAG" \
            --title "SoundControl $RELEASE_TAG" \
            --generate-notes \
            --latest \
            || gh release edit "$RELEASE_TAG" --latest
          gh release upload "$RELEASE_TAG" release-assets/*.exe --clobber
          gh release view "$RELEASE_TAG"
      - name: Attach build folder to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: SoundControl-Windows-Release
          path: |
            release/
            release-assets/
          if-no-files-found: error
