name: Release Windows

# Tagging a commit on main (e.g. `git tag v1.0.5 main && git push origin v1.0.5`)
# builds the standard NSIS Windows installer and publishes one asset on
# a new GitHub Release. A commit on any arena session branch whose message
# contains [publish-windows] can also rebuild the stable release matching
# package.json without requiring an artifact download.
# SoundControl-Setup.exe. The in-app download button deep-links to this name
# via "/releases/latest/download/..." so every client gets the newest build.
#
# Authenticode code signing (which removes the SmartScreen "unknown
# publisher" warning) is automatic when these repository secrets exist:
#   WINDOWS_CERTIFICATE_BASE64    base64 of the .p12/.pfx certificate
#   WINDOWS_CERTIFICATE_PASSWORD  the certificate's password
# Without them the installer is built unsigned, exactly as before.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'arena/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.0.2'
        required: true
        type: string
      source_ref:
        description: 'Git ref to build (leave blank to use the selected ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-win:
    # Tag pushes are the documented release path (see the header comment), and
    # a tag push payload has no head_commit, so the marker check can never
    # satisfy it: without the refs/tags clause every `git push origin vX.Y.Z`
    # silently skipped this job. Branch pushes keep requiring the marker so
    # ordinary work on an arena branch never publishes.
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[publish-windows]') }}
    runs-on: windows-latest
    # The `secrets` context is not available inside a step's `if:` expression,
    # so mirror the certificate secrets into job env for the gating check.
    # Unset secrets evaluate to '' and the signing step simply skips.
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up Authenticode signing (skipped without certificate secrets)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WINDOWS_CERT_BASE64" | tr -d '\r\n' | base64 --decode > cert.p12
          test -s cert.p12
          # electron-builder signs app + installer automatically via CSC_LINK.
          echo "CSC_LINK=$(cygpath -w "$PWD/cert.p12")" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WINDOWS_CERT_PASSWORD" >> "$GITHUB_ENV"
          echo "Certificate staged — electron-builder will Authenticode-sign the build."
      # Build the Windows installer; the Release itself is published by the
      # steps below rather than by electron-builder's built-in publisher.
      # SOUNDCONTROL_PYTHON_REQUIRED makes the `prebuild:win` hook hard-fail if
      # the bundled Python runtime could not be staged, so a release can never
      # ship without it (that runtime is what makes earbud detection work with
      # zero user setup).
      - name: Build Windows installer (with bundled Python runtime)
        env:
          SOUNDCONTROL_PYTHON_REQUIRED: '1'
        run: npm run build:win -- --publish never
      - name: Verify the installer upgrades an existing app
        shell: pwsh
        run: ./scripts/smoke-windows-upgrade.ps1
      - name: Verify the bundled Python runtime shipped
        shell: bash
        run: |
          set -euo pipefail
          test -f release/win-unpacked/resources/python/python.exe
          ls -la release/win-unpacked/resources/python | head -15
          echo "Bundled runtime present — desktop users install nothing extra."
      # This is the guard against silently shipping an unsigned installer.
      # Without the certificate secrets the build is allowed to be unsigned
      # (that is the documented default) and the step only reports it. Once
      # WINDOWS_CERTIFICATE_BASE64/WINDOWS_CERTIFICATE_PASSWORD exist, a build
      # whose installer is NOT Authenticode-valid fails here, so a
      # misconfigured certificate can never publish another "Unknown
      # publisher" release without someone explicitly seeing the failure.
      - name: Report Authenticode signature status
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw "no installer found under release/" }
          $sig = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "Installer:  $($installer.Name)"
          Write-Host "Signature:  $($sig.Status)"
          if ($env:WINDOWS_CERT_BASE64) {
            if ($sig.Status -ne 'Valid') {
              throw "Certificate secrets are configured but the installer is $($sig.Status) — refusing to publish an unsigned release. Status message: $($sig.StatusMessage)"
            }
            Write-Host "Signer:     $($sig.SignerCertificate.Subject)"
            Write-Host "Signed build verified — SmartScreen will not show 'Unknown publisher' for this installer."
          } else {
            Write-Host "No certificate secrets configured — installer ships unsigned (expected; see README 'Code signing & SmartScreen')."
          }
      - name: Remove certificate material
        if: always()
        shell: bash
        run: rm -f cert.p12
      - name: Stage the single installer asset
        shell: bash
        run: |
          set -euo pipefail
          echo "Built Windows distributables:"
          ls -la release/*.exe
          # Exactly one artifact: the NSIS installer (win-unpacked/ is a
          # subdirectory, so maxdepth 1 only sees the distributable itself).
          test "$(find release -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          INSTALLER="$(find release -maxdepth 1 -name '*.exe' | head -n 1)"
          test -n "$INSTALLER"
          mkdir -p release-assets
          cp "$INSTALLER" "release-assets/SoundControl-Setup.exe"
          echo "Staged release asset:"
          ls -la release-assets/
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: $(grep '^tag=' "$GITHUB_OUTPUT" | cut -d= -f2)"
      - name: Publish GitHub Release with the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Publishing release for tag: $RELEASE_TAG"
          # Create the release (no-op on a re-run), then upload the installer
          # from release-assets/, whose filename is the published asset name.
          gh release create "$RELEASE_TAG" \
            --title "SoundControl $RELEASE_TAG" \
            --generate-notes \
            --latest \
            || gh release edit "$RELEASE_TAG" --latest
          gh release upload "$RELEASE_TAG" release-assets/*.exe --clobber
          gh release view "$RELEASE_TAG"
      - name: Attach build folder to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: SoundControl-Windows-Release
          path: |
            release/
            release-assets/
          if-no-files-found: error
