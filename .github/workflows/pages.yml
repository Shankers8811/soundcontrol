name: GitHub Pages

on:
  push:
    branches: [main, master, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The github-pages environment is restricted by a branch policy to
    # main/master; deploying from PR/feature branches is blocked. The build
    # job above still validates every branch, but only publish from the
    # production branches (or a manual dispatch).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        # A Pages site can be published by two sources at the same time: this
        # workflow's artifact deploy, and a legacy "Deploy from a branch" build.
        # When branch mode is enabled it runs off the same push and finishes a few
        # seconds *after* this job, so it overwrites the good deployment - the job
        # goes green and the URL ends up serving the repository source, where
        # index.html loads /src/main.tsx, which no browser can execute (blank page,
        # no manifest, no service worker, no install). Verify twice, with a wait in
        # between, so that overwrite is caught and not just raced past.
      - name: Verify the live site is this build
        shell: bash
        run: |
          set -uo pipefail
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          base="https://${owner}.github.io/${repo}"
          # Proves the site is the raw tree: this exact string only ever exists in
          # the source index.html, never in a Vite build.
          branch_served() {
            body="$(curl -fsSL --max-time 20 "$1" 2>/dev/null || true)"
            printf '%s' "$body" | grep -q 'src="/src/main.tsx"'
          }
          shell_missing() {
            root="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/manifest.json")"
            nested="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/public/manifest.json")"
            [ "$root" != "200" ] && [ "$nested" = "200" ]
          }
          built_visible() {
            body="$(curl -fsSL --max-time 20 "$1" 2>/dev/null || true)"
            printf '%s' "$body" | grep -qE 'src="\.?/?assets/'
          }
          fail_branch_mode() {
            echo "::error title=Pages is serving the repository tree, not this build::$base serves index.html referencing /src/main.tsx (or 404s on /manifest.json while /public/manifest.json answers), so the web app renders blank and cannot be installed."
            echo "Fix: repo Settings -> Pages -> Source: choose 'GitHub Actions'. While 'Deploy from a branch' is also enabled, its build lands seconds after this job and replaces dist/ with the raw tree."
            exit 1
          }
          # 1) wait for this deployment to become visible (Pages propagation is slow)
          seen=""
          for attempt in 1 2 3 4 5 6; do
            if branch_served "$base/index.html?run=${{ github.run_id }}-a"; then fail_branch_mode; fi
            if built_visible "$base/index.html?run=${{ github.run_id }}-a"; then seen="yes"; break; fi
            echo "attempt $attempt: this build is not visible yet, retrying in 15s"
            sleep 15
          done
          if [ -z "$seen" ]; then
            # Never fail on propagation lag alone - only on proven wrong content.
            echo "::warning title=Could not verify deployed content::The live index.html did not show a built asset reference within ~90s. Check $base once before re-running."
            exit 0
          fi
          echo "Deployment verified on first look: Pages is serving this build (hashed ./assets/ reference present)."
          # 2) the branch-source build, if enabled, lands seconds later - check again
          echo "waiting 75s to confirm nothing overwrites this deployment"
          sleep 75
          if branch_served "$base/index.html?run=${{ github.run_id }}-b" || shell_missing; then
            echo "This job's deployment was correct, then a different publisher replaced it."
            fail_branch_mode
          fi
          if built_visible "$base/index.html?run=${{ github.run_id }}-b"; then
            echo "Still correct after 75s - Pages is publishing this workflow's artifact."
          else
            echo "::warning::The built asset reference was not found on the second look; re-check $base if the site looks stale."
          fi
