name: Windows Build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never: electron-builder auto-detects CI and would
      # otherwise try to publish a GitHub Release on every push.
      - run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SoundControl-Windows
          path: release/
          if-no-files-found: error
